[package]
name = "purergb"
version = "0.52.3"
description = "PureRGB — contrôle RGB, ARGB, ventilateurs, AIO et hubs pour Windows 10/11"
authors = ["Heiphaistos"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "purergb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"
parking_lot = "0.12"
sha2 = "0.10"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
sysinfo = "0.39"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Vérification de la signature de la mise à jour portable (self_update.rs) : déjà dans Cargo.lock via tauri-plugin-updater
minisign-verify = "0.3"
base64 = "0.22"
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
jpeg-encoder = "0.6"
serialport = { version = "4", default-features = false }
nusb = "0.2"
# DES-CBC de l'en-tête chiffré des écrans TURZX (1CBE) : RustCrypto, aucune autre dépendance nouvelle
des = "=0.8.1"
# Archives .purergb-theme (screens/theme_pack.rs) : zip 4.6.1 est déjà dans Cargo.lock (tiré par tauri-plugin-updater),
# thèmes : stockés sans recompression ; `deflate-flate2` (flate2 déjà dans Cargo.lock) sert à lire le zip ffmpeg (screens/ffmpeg_install.rs)
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
# Manette Xbox 360 virtuelle (gamepad_remap/emit.rs) : MIT, Rust pur, parle au pilote ViGEmBus par DeviceIoControl
vigem-client = "=0.1.4"
# Chargement dynamique de PawnIOLib.dll (backends/smbus/pawnio.rs) ; 0.7.4 est déjà dans Cargo.lock
libloading = "0.7"
# SCSI pass-through des écrans Thermalright (screens/drivers/scsi_win.rs)
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Lecture vidéo via Media Foundation (screens/video_mf.rs). 0.61 = version déjà tirée par tauri/wry
# dans Cargo.lock : aucune seconde copie de la crate. Fonctionnalités minimales.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Input_XboxController",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
